[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sentinel"
version = "0.1.0"
description = "Independent technical-indicator monitoring utility using TA-Lib"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["TA-Lib==0.8.3"]

[project.scripts]
market-sentinel = "market_sentinel.__main__:main"
sentinel = "market_sentinel.report_history:launch"

[tool.setuptools.packages.find]
where = ["src"]
